replicaCount: 1

image:
  repository: ghcr.io/mcphq/ai-gateway
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gateway.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Public URL browsers use. Required for sign-in cookies.
auth:
  url: http://localhost:3000
  # Leave empty to generate a secret on first install and keep it across upgrades.
  secret: ""
  trustedOrigins: ""

# 64 hex characters. Leave empty to generate one on first install.
# Changing this makes stored provider keys unreadable.
encryptionKey: ""

# Set url to use a database outside this chart. When url is empty and
# postgres.enabled is true, the chart starts Postgres and builds DATABASE_URL.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: DATABASE_URL

# When existingSecret is set, the chart does not create a Secret. That Secret
# must contain DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL, and ENCRYPTION_KEY.
existingSecret: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: aicost
    password: ""
    database: aicost
  persistence:
    size: 8Gi
    storageClass: ""
  resources: {}

extraEnv: []
