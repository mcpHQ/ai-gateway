{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-gateway.fullname" . }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "ai-gateway.fullname" .) }}
  {{- $authSecret := .Values.auth.secret }}
  {{- if and (not $authSecret) $existing (hasKey $existing.data "BETTER_AUTH_SECRET") }}
  {{- $authSecret = index $existing.data "BETTER_AUTH_SECRET" | b64dec }}
  {{- end }}
  {{- if not $authSecret }}
  {{- $authSecret = randAlphaNum 48 }}
  {{- end }}
  BETTER_AUTH_SECRET: {{ $authSecret | b64enc | quote }}
  BETTER_AUTH_URL: {{ required "auth.url is required" .Values.auth.url | b64enc | quote }}
  {{- if .Values.auth.trustedOrigins }}
  BETTER_AUTH_TRUSTED_ORIGINS: {{ .Values.auth.trustedOrigins | b64enc | quote }}
  {{- end }}
  {{- $encryptionKey := .Values.encryptionKey }}
  {{- if and (not $encryptionKey) $existing (hasKey $existing.data "ENCRYPTION_KEY") }}
  {{- $encryptionKey = index $existing.data "ENCRYPTION_KEY" | b64dec }}
  {{- end }}
  {{- if not $encryptionKey }}
  {{- $encryptionKey = sha256sum (randAlphaNum 32) }}
  {{- end }}
  ENCRYPTION_KEY: {{ $encryptionKey | b64enc | quote }}
  {{- if not .Values.database.existingSecret }}
  {{- $databaseUrl := .Values.database.url }}
  {{- if not $databaseUrl }}
  {{- if not .Values.postgres.enabled }}
  {{- fail "Set database.url or database.existingSecret when postgres.enabled is false" }}
  {{- end }}
  {{- $password := .Values.postgres.auth.password }}
  {{- if and (not $password) $existing (hasKey $existing.data "POSTGRES_PASSWORD") }}
  {{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
  {{- end }}
  {{- if not $password }}
  {{- $password = randAlphaNum 24 }}
  {{- end }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | b64enc | quote }}
  {{- $databaseUrl = printf "postgres://%s:%s@%s:5432/%s" .Values.postgres.auth.username $password (include "ai-gateway.postgresName" .) .Values.postgres.auth.database }}
  {{- end }}
  DATABASE_URL: {{ $databaseUrl | b64enc | quote }}
  {{- end }}
{{- end }}
