services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aicost
      POSTGRES_PASSWORD: aicost
      POSTGRES_DB: aicost
    ports:
      - "5432:5432"
    volumes:
      - aicost-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicost -d aicost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ai-gateway
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://aicost:aicost@postgres:5432/aicost
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-with-a-32-character-secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aicost-postgres:
