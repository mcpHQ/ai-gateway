services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: aicost
    volumes:
      - aicost-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d aicost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      SERVICE_URL_WEB_3000: /
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/aicost
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB_3000}
      ENCRYPTION_KEY: ${SERVICE_HEX_64_ENCRYPTION}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  aicost-postgres:
